# Same as at_manifeel_pih.yaml but with n_latent_dims 4 -> 16.
#
# at_manifeel_pih.yaml inherited n_latent_dims: 4 from at_peel.yaml, where that
# value is the *commented-out* "for peeling" setting; the config actually used
# by the working real-robot runs (SPP_RAD_IROS2026/.../at/at_peel.yaml) sets 16.
# Our own file flagged the value as an untuned placeholder in its header.
#
# n_latent_dims is the AT's real bottleneck width. In the non-VQ path
# (model.py) it sizes both projections around the latent:
#     quant      : Conv1d(n_latent_dims -> 2*n_embed)
#     post_quant : Conv1d(n_embed -> n_latent_dims)
#     decoder cond dim = n_latent_dims * downsampled_input_h
# so at 4 the RNN decoder is conditioned on only 4*8 = 32 numbers to rebuild a
# 32x6 action chunk, and the 8*n_embed = 128-dim vector the diffusion predicts
# is squeezed back through that 32-dim subspace -- most of what the diffusion is
# scored on cannot reach the action. At 16 the decoder sees 16*8 = 128, matching
# the working real-robot setup.
#
# Kept as a separate file rather than editing at_manifeel_pih.yaml so the
# existing AT checkpoint (trained at 4) stays loadable for comparison.

horizon: 32
n_obs_steps: 2
dataset_obs_temporal_downsample_ratio: 2

policy:
  horizon: ${horizon}
  n_latent_dims: 16
  mlp_layer_num: 1
  use_conv_encoder: True
  conv_latent_dims: 32
  conv_layer_num: 1
  use_rnn_decoder: True
  rnn_latent_dims: 32
  rnn_layer_num: 1
  kl_multiplier: 1e-6
  n_embed: 16
  # ==============
  use_vq: False
  vqvae_groups: 4
  eval: false
  act_scale: 1
