# manifeel PiH task config aligned with upstream's own layout.
#
# Upstream (real_peel_image_gelsight_emb_ldp_24fps.yaml and every other LDP task
# in the repo) splits the two observation roles like this:
#     obs          : image(s) + robot pose + gripper width + tactile
#     extended_obs : the tactile key ONLY -- the same key that also appears in obs
# Robot pose never enters extended_obs. That is the point of the design: the AT's
# RNN decoder is meant to re-contextualise a latent action against TOUCH, so
# giving it pose would let it reconstruct the action from pose history instead.
#
# Our earlier manifeel configs put state (ee_pos + ee_quat) into extended_obs and
# used a different tactile key there than in obs. Zeroing each channel on the
# trained AT showed the decoder leaning hardest on exactly the channel upstream
# excludes: state -> 276x worse action MSE, contact_8d -> 86x. So the decoder we
# trained is closer to a pose-driven action reconstructor than a tactile-reactive
# one, which also explains why swapping oracle for padded temporal_cond barely
# moved anything back on 09/06 -- pose varies smoothly, so padding it costs little.
#
# Two deviations are removed here:
#   extended_obs = contact_8d_right only (state dropped)
#   obs carries contact_8d_right too, so both roles use the same tactile key
#
# CAVEAT worth keeping in view: this dataset has no tactile->action dependence to
# learn from. The scripted expert reads socket_pos/socket_quat/ee_pos/plug_quat
# and never touches force, and adding tactile to a k-NN observation metric moved
# neighbour action ambiguity by -0.2% (wrist moved it -19%). Upstream's data is
# human teleoperation on a real robot, where the reaction is genuinely present.
# So this config restores the intended STRUCTURE; making it pay off needs an
# expert that reacts to contact, i.e. regenerated data.
#
# Needs its own AT run: extended_obs changed, so the AT's temporal_cond_dim goes
# from 15 to 8 and existing AT checkpoints will not load.

name: manifeel_pih_c8d_ldp_front_aligned

image_shape: [3, 256, 256]
dataset_path: data/manifeel_pih_quan_June06_c8d

shape_meta: &shape_meta
  obs:
    wrist:
      shape: ${task.image_shape}
      type: rgb
    front:
      shape: ${task.image_shape}
      type: rgb
    state:
      shape: [7]
      type: low_dim
    contact_8d_right:
      shape: [8]
      type: low_dim
  extended_obs: # for the AT RNN decoder of the latent diffusion policy
    contact_8d_right:
      shape: [8]
      type: low_dim
  action:
    shape: [6]

dataset:
  _target_: reactive_diffusion_policy.dataset.real_image_tactile_latent_diffusion_dataset.RealImageTactileLatentDiffusionDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  obs_temporal_downsample_ratio: ${dataset_obs_temporal_downsample_ratio}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: null
  delta_action: False
  relative_action: False

  # for calculating the normalizer parameters for the latent action
  use_latent_action_before_vq: False
  at:
    _target_: reactive_diffusion_policy.model.vae.model.VAE
    shape_meta: ${shape_meta}
    horizon: ${at.policy.horizon}
    n_latent_dims: ${at.policy.n_latent_dims}
    mlp_layer_num: ${at.policy.mlp_layer_num}
    use_conv_encoder: ${at.policy.use_conv_encoder}
    conv_latent_dims: ${at.policy.conv_latent_dims}
    conv_layer_num: ${at.policy.conv_layer_num}
    use_rnn_decoder: ${at.policy.use_rnn_decoder}
    rnn_latent_dims: ${at.policy.rnn_latent_dims}
    rnn_layer_num: ${at.policy.rnn_layer_num}
    use_vq: ${at.policy.use_vq}
    n_embed: ${at.policy.n_embed}
    vqvae_groups: ${at.policy.vqvae_groups}
    eval: true
    load_dir: ${at_load_dir}
    act_scale: ${at.policy.act_scale}
